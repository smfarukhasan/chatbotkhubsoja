services:
  backend:
    build:
      context: ./backend_js
      target: development
    container_name: automation-backend
    env_file:
      - ./backend_js/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend_js:/app
      - /app/node_modules
      - ./backend_js/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

